name: Mise à jour quotidienne de l'indicateur

on:
  schedule:
    - cron: "30 5 * * *"   # 5h30 UTC, après le relevé quotidien de data.education.gouv.fr (vers 3h, heure de Paris)
  workflow_dispatch:         # lancement manuel depuis l'onglet Actions

permissions:
  contents: write

jobs:
  calcul:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Collecter les données et calculer l'indicateur
        run: python pipeline/run.py
      - name: Enregistrer les résultats dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data
          git diff --cached --quiet || git commit -m "Mise à jour automatique du $(date -u +%F)"
          git push
